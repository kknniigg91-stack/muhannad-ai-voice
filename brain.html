<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عقل مهند - مركز التدريب والمراقبة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',sans-serif}
body{background:radial-gradient(circle at 20% 10%,#1a1230 0%,#0a0a14 45%,#02020a 100%);color:#fff;min-height:100dvh;padding:16px}
h1{font-size:22px;text-align:center;background:linear-gradient(90deg,#fff,#b8a8ff,#7de8d5);-webkit-background-clip:text;color:transparent;margin-bottom:4px}
.subtitle{text-align:center;color:#8a8aa0;font-size:13px;margin-bottom:20px}
.card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:16px;margin-bottom:16px;backdrop-filter:blur(10px)}
h2{font-size:16px;color:#b8a8ff;margin-bottom:12px}
input,textarea,select{width:100%;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.3);color:#fff;font-family:inherit;font-size:14px;margin-bottom:10px}
input:focus,textarea:focus{outline:none;border-color:#7c5cff}
button{background:linear-gradient(135deg,#7c5cff,#5a3ce0);color:#fff;border:none;border-radius:10px;padding:10px 20px;font-weight:bold;cursor:pointer;width:100%;font-family:inherit;font-size:14px;transition:.2s}
button:active{transform:scale(.97)}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab-btn{flex:1;padding:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:10px;color:#8a8aa0;font-weight:bold;cursor:pointer;text-align:center;transition:0.3s}
.tab-btn.active{background:linear-gradient(135deg,rgba(124,92,255,.3),rgba(124,92,255,.1));color:#fff;border-color:#7c5cff}
.stats{display:flex;gap:10px;text-align:center}
.stat-box{flex:1;background:rgba(255,255,255,.05);border-radius:12px;padding:10px;border:1px solid rgba(255,255,255,.1)}
.stat-box .num{font-size:24px;font-weight:bold;color:#00e5c0}
.stat-box .lbl{font-size:11px;color:#8a8aa0}
.training-item{background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:12px;margin-bottom:10px}
.training-item .trigger{color:#00e5c0;font-weight:bold;font-size:14px;margin-bottom:4px}
.training-item .response{color:#e0e0e0;font-size:13px;margin-bottom:8px;line-height:1.5}
.training-item .meta{font-size:11px;color:#8a8aa0;display:flex;justify-content:space-between;align-items:center}
.del-btn{background:#ff4d6d;color:#fff;border:none;border-radius:6px;padding:4px 8px;font-size:11px;cursor:pointer;width:auto}
.user-item{background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:0.2s}
.user-item:hover{background:rgba(124,92,255,.1);border-color:#7c5cff}
.user-item.active{border-color:#00e5c0;background:rgba(0,229,192,.05)}
.chat-bubble{max-width:85%;padding:8px 12px;border-radius:12px;margin-bottom:8px;font-size:13px;line-height:1.5;position:relative}
.chat-bubble.user{align-self:flex-start;background:rgba(124,92,255,.2);border:1px solid rgba(124,92,255,.3);color:#e6dfff;margin-right:auto}
.chat-bubble.ai{align-self:flex-end;background:rgba(0,229,192,.1);border:1px solid rgba(0,229,192,.3);color:#d4fff6;margin-left:auto}
.chat-time{font-size:10px;color:#8a8aa0;margin-top:4px;text-align:left}
#chatViewer{display:flex;flex-direction:column;gap:8px;margin-top:10px;min-height:100px;max-height:400px;overflow-y:auto;padding:4px;}
.admin-input-area{display:flex;gap:8px;margin-top:12px;}
.admin-input-area input{margin-bottom:0;}
.admin-input-area button{width:auto;padding:10px 16px;}
</style>
</head>
<body>
  <h1>🧠 عقل مهند</h1>
  <p class="subtitle">مركز إدارة وتدريب الشخصية الذكية</p>

  <div class="tabs">
    <div class="tab-btn active" onclick="switchTab('trainings', this)">📚 التدريبات</div>
    <div class="tab-btn" onclick="switchTab('monitoring', this)">👁️ المستخدمين والمراقبة</div>
  </div>

  <div id="tab-trainings">
    <div class="stats card">
      <div class="stat-box"><div class="num" id="statTotal">0</div><div class="lbl">إجمالي التدريبات</div></div>
      <div class="stat-box"><div class="num" id="statActive">0</div><div class="lbl">التدريبات النشطة</div></div>
    </div>
    <div class="card">
      <h2>➕ إضافة تدريب جديد</h2>
      <input type="text" id="trigInput" placeholder="النص المُحفّز (سؤال المستخدم)">
      <textarea id="respInput" placeholder="رد الذكاء الاصطناعي" rows="3"></textarea>
      <select id="catInput"><option value="عام">عام</option><option value="ترحيب">ترحيب</option><option value="نكتة">نكتة</option><option value="شخصية">شخصية</option><option value="غزل">غزل</option></select>
      <button onclick="addTraining()">حفظ التدريب</button>
    </div>
    <div class="card">
      <h2>📋 التدريبات المحفوظة</h2>
      <div id="trainingsList"></div>
    </div>
  </div>

  <div id="tab-monitoring" style="display:none;">
    <div class="card">
      <h2>👥 المستخدمين (الذين تحدثوا مع مهند)</h2>
      <button onclick="loadUsers()" style="margin-bottom:10px; background:linear-gradient(135deg,#00e5c0,#00a085); color:#001a15;">🔄 تحديث قائمة المستخدمين</button>
      <div id="usersList"><p style="color:#8a8aa0; text-align:center; font-size:13px;">اضغط على تحديث لجلب الأسماء...</p></div>
    </div>
    
    <div class="card" id="chatViewerCard" style="display:none;">
      <h2 id="chatViewerTitle">💬 محادثات: <span id="currentChatUser"></span></h2>
      <div id="chatViewer"></div>
      <!-- خانة رد الإدارة -->
      <div class="admin-input-area">
        <input type="text" id="adminReplyInput" placeholder="اكتب ردك هنا كمساعد للذكاء..." onkeypress="if(event.key==='Enter') adminSendReply()">
        <button onclick="adminSendReply()">إرسال</button>
      </div>
    </div>
  </div>

<script>
const WORKER_URL = "https://muhannad-brain-v2.kknniigg91.workers.dev";
let allChatsCache = [];
let activeChatUsername = null;

function switchTab(tabName, btn) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-trainings').style.display = tabName === 'trainings' ? 'block' : 'none';
    document.getElementById('tab-monitoring').style.display = tabName === 'monitoring' ? 'block' : 'none';
}

// ================= التدريبات =================

async function loadTrainings() {
    const list = document.getElementById('trainingsList');
    try {
        const res = await fetch(`${WORKER_URL}/db/trainings?select=*&order=created_at.desc`, { headers: { 'Content-Type': 'application/json' } });
        const data = await res.json();
        
        document.getElementById('statTotal').textContent = data.length;
        document.getElementById('statActive').textContent = data.length;
        
        if (data.length === 0) {
            list.innerHTML = '<p style="color:#8a8aa0; text-align:center; font-size:13px;">لا توجد تدريبات بعد.</p>';
            return;
        }
        list.innerHTML = data.map(t => `
            <div class="training-item">
                <div class="trigger">س: ${t.trigger_text}</div>
                <div class="response">ج: ${t.response_text}</div>
                <div class="meta"><span>${t.category} • ${new Date(t.created_at).toLocaleDateString('ar')}</span><button class="del-btn" onclick="deleteTraining(${t.id})">حذف</button></div>
            </div>
        `).join('');
    } catch(e) {
        list.innerHTML = '<p style="color:#ff4d6d; text-align:center;">فشل تحميل التدريبات: ' + e.message + '</p>';
    }
}

async function addTraining() {
    const trig = document.getElementById('trigInput').value.trim();
    const resp = document.getElementById('respInput').value.trim();
    const cat = document.getElementById('catInput').value;
    if (!trig || !resp) return alert("الرجاء ملء الحقول!");
    
    try {
        await fetch(`${WORKER_URL}/db/trainings`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ trigger_text: trig, response_text: resp, category: cat })
        });
        document.getElementById('trigInput').value = '';
        document.getElementById('respInput').value = '';
        loadTrainings(); // إعادة تحميل القائمة
    } catch(e) {
        alert("فشل الحفظ: " + e.message);
    }
}

async function deleteTraining(id) {
    if (!confirm("هل أنت متأكد من حذف هذا التدريب؟")) return;
    try {
        await fetch(`${WORKER_URL}/db/trainings?id=eq.${id}`, { method: 'DELETE', headers: { 'Content-Type': 'application/json' } });
        loadTrainings();
    } catch(e) {
        alert("فشل الحذف: " + e.message);
    }
}

async function adminSendReply() {
    const input = document.getElementById('adminReplyInput');
    const text = input.value.trim();
    if (!text || !activeChatUsername) return;

    input.value = ''; // تفريغ الحقل فوراً

    try {
        const res = await fetch(`${WORKER_URL}/db/chats`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                username: activeChatUsername, 
                role: 'assistant', 
                message: text 
            })
        });
        
        if (!res.ok) throw new Error('HTTP ' + res.status);
        
        // نضيف الرسالة للمخزن المحلي بدون ما نطلب كل المحادثات من السيرفر
        const newChat = {
            id: Date.now(),
            username: activeChatUsername,
            role: 'assistant',
            message: text,
            created_at: new Date().toISOString()
        };
        allChatsCache.push(newChat);
        
        // نحدث الواجهة
        const userChats = allChatsCache
            .filter(c => c.username === activeChatUsername)
            .sort((a,b) => new Date(a.created_at) - new Date(b.created_at));
        renderChatMessages(userChats);
        
    } catch(e) {
        alert("فشل إرسال الرد: " + e.message);
    }
}

document.addEventListener('DOMContentLoaded', () => { loadTrainings(); });
</script>
</body>
</html>
