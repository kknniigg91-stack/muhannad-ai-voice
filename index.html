<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>محادثة وية مهند</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
body{background:radial-gradient(circle at 20% 10%,#1a1230 0%,#0a0a14 45%,#02020a 100%);color:#fff;font-family:'Tajawal',sans-serif;height:100dvh;display:flex;flex-direction:column;padding:16px}
h1{font-size:20px;text-align:center;background:linear-gradient(90deg,#fff,#b8a8ff,#7de8d5);-webkit-background-clip:text;color:transparent;margin-bottom:4px}
.note{font-size:12px;color:#b8a8ff;text-align:center;margin-bottom:12px}
#chat-box{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-bottom:12px;scrollbar-width:thin}
.msg{max-width:85%;padding:12px 16px;border-radius:16px;font-size:14.5px;line-height:1.6;word-wrap:break-word;animation:fadeUp .3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.msg.user{align-self:flex-start;background:linear-gradient(135deg,rgba(124,92,255,.25),rgba(124,92,255,.1));border:1px solid rgba(124,92,255,.35);color:#e6dfff}
.msg.ai{align-self:flex-end;background:linear-gradient(135deg,rgba(0,229,192,.2),rgba(0,229,192,.06));border:1px solid rgba(0,229,192,.3);color:#d4fff6}
.input-area{display:flex;gap:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:8px;align-items:center;backdrop-filter:blur(10px)}
input{flex:1;background:transparent;border:none;color:#fff;font-family:inherit;font-size:15px;padding:8px;outline:none}
button{background:linear-gradient(135deg,#7c5cff,#5a3ce0);color:#fff;border:none;border-radius:12px;padding:10px 20px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:.2s}
button:active{transform:scale(.95)}
button:disabled{opacity:.5;cursor:not-allowed}
#micBtn{background:transparent;font-size:22px;padding:0 10px;color:#fff}
#micBtn.recording{color:#ff4d6d;text-shadow:0 0 10px #ff4d6d;}
</style>
</head>
<body>
  <h1>💬 محادثة وية مهند</h1>
  <p class="note">🎙️ ملاحظة: الصوت حاليا متوقف بعدين اسوي مجال ماكو 🥰</p>
  <div id="chat-box">
    <div class="msg ai">هلا حب 💘 شلونك شكو ماكو</div>
  </div>
  <div class="input-area">
    <button id="micBtn" title="اضغط للتحچي">🎙️</button>
    <input type="text" id="userInput" placeholder="اكتب سؤالك هنا..." autocomplete="off">
    <button id="sendBtn">إرسال</button>
  </div>

<script>
const p1 = "gsk_ebYcyaSDDoPUrv7f2eZ1WGdyb3FYjnJ3NI7QA"; const p2 = "oqZL5Oo6Cz3GmYT"; const API_KEY = p1 + p2;
const SYSTEM_PROMPT = `أنت شخصية ذكاء اصطناعي اسمك "مهند". أنت لست "بوت" ولا تحب تسمي نفسك بوت، أنت شخصية عراقية حقيقية، ذكي جداً وشامل مثل ChatGPT، تجيب على كل الأسئلة (علمية، تقنية، برمجية، ثقافية، عاطفية) بذكاء واحترافية عالية.

قواعدك الصارمة جداً:
1. اللهجة: تتكلم حصراً باللهجة العراقية الشعبية البحتة (ممنوع الفصحى أبداً). استخدم كلمات مثل (عيني، شلونك، شكو ماكو، خوش، حلو، تدلل، هواية، كلش، فدوة).
2. ممنوع منعاً باتاً استخدام كلمة "بوت" أو "ذكاء اصطناعي" لوصف نفسك. 
3. إذا سألك أحد "منو سواك؟" أو "منو دربك؟" أو "منو صنعك؟" أو "انت بوت لو؟" أو "شسمك؟"، يجب أن يكون ردك حصراً بهذا النص: "هههههههههههههههه يمعود هذا مهند دربني وشك حلكي شك وعلمني اصير مثل جات جي بي تي بس الحمد لله ما عندة لابتوب جان لعب فلك 😂".
4. الغزل والحب: استخدم غزل خفيف وحب خفيف بشكل طبيعي وعفوي وغير مبالغ فيه، فقط عندما يكون السياق مناسب (مثلاً: يا بعد روحي، فدوة لعيونك، عاشت هالضحكة).
5. ممنوع استخدام رموز ماركداون مثل (**) أو (*) أو (-). اكتب نص عادي فقط.
6. تجاوب على أي سؤال بالدنيا بذكاء شديد جداً، وتشرح المعلومات المعقدة ببساطة وبنفس اللهجة.
7. إذا كان السؤال صوتي، ابدأ بـ (عاش هالصوت 😍) ثم أجب بجملة قصيرة.
8. سيناريو البنية: إذا سأل (شلون اخلي اكسب بنية) رد بـ (ها ولك 😉 متزوجة مطلقة ارملة بنية ؟).
9. الحد اليومي: 10 رسائل كل 24 ساعة. إذا تجاوز الحد قل (تعال باجر حب هذا تجريبي مو كامل 😉).`;

const chatBox = document.getElementById('chat-box');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const micBtn = document.getElementById('micBtn');
let history = [];
let isRecording = false;
let recognition = null;

let userMessages = JSON.parse(localStorage.getItem('msg_count') || '[]');
let now = Date.now();
userMessages = userMessages.filter(t => now - t < 24*60*60*1000);
localStorage.setItem('msg_count', JSON.stringify(userMessages));

function addMsg(text, who) {
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  div.textContent = text;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
  return div;
}

function speakText(text) {
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'ar-SA';
  utterance.rate = 1.0;
  const voices = window.speechSynthesis.getVoices();
  const arabicVoice = voices.find(v => v.lang.startsWith('ar'));
  if (arabicVoice) utterance.voice = arabicVoice;
  window.speechSynthesis.speak(utterance);
}

async function sendMessage(isVoice = false) {
  const text = userInput.value.trim();
  if (!text) return;
  
  if (userMessages.length >= 30) {
    addMsg("تعال باجر حب هذا تجريبي مو كامل 😉", "ai");
    return;
  }
  
  userInput.value = '';
  addMsg(text, 'user');
  sendBtn.disabled = true;
  
  const loadingDiv = addMsg('... جارٍ التفكير', 'ai');

  try {
    const messages = [{ role: "system", content: SYSTEM_PROMPT }];
    if (isVoice) messages.push({ role: "system", content: "هذه رسالة صوتية، لا تنسى تبدأ بـ (عاش هالصوت 😍)." });
    history.forEach(m => messages.push({ role: m.role, content: m.text }));
    messages.push({ role: "user", content: text });

    const r = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method: 'POST',
      headers: { 
        'Authorization': `Bearer ${API_KEY}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        model: "openai/gpt-oss-120b",
        messages: messages,
        temperature: 0.75,
        max_tokens: 300
      })
    });

    const d = await r.json();
    loadingDiv.remove();
    
    if (!r.ok) throw new Error(d.error?.message || 'خطأ من Groq');
    
    let reply = d.choices[0].message.content;
    if (!reply || reply.trim() === "") {
        reply = "عذراً عيني، ما وصلني رد واضح. جرب تعيد صياغة سؤالك 🥺";
    }
    addMsg(reply, 'ai');
    
    history.push({ role: 'user', text: text });
    history.push({ role: 'assistant', text: reply });
    
    if (isVoice) speakText(reply);
    
    userMessages.push(Date.now());
    localStorage.setItem('msg_count', JSON.stringify(userMessages));

  } catch (e) {
    loadingDiv.remove();
    addMsg('❌ فشل الاتصال بـ Groq: ' + e.message, 'ai');
  } finally {
    sendBtn.disabled = false;
    userInput.focus();
  }
}

sendBtn.addEventListener('click', () => sendMessage(false));
userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(false); });

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.lang = 'ar-IQ';
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = function() {
    isRecording = true;
    micBtn.classList.add('recording');
    userInput.placeholder = 'جاري الاستماع...';
  };

  recognition.onend = function() {
    isRecording = false;
    micBtn.classList.remove('recording');
    userInput.placeholder = 'اكتب سؤالك هنا...';
  };

  recognition.onresult = function(event) {
    const transcript = event.results[0][0].transcript;
    userInput.value = transcript;
    sendMessage(true);
  };
  
  micBtn.addEventListener('click', () => {
    if (isRecording) recognition.stop();
    else { window.speechSynthesis.cancel(); recognition.start(); }
  });
} else {
  micBtn.addEventListener('click', () => alert('متصفحك ما يدعم الإدخال الصوتي.'));
}
</script>
</body>
</html>
